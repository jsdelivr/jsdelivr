name: Other
description: Anything that doesn't fit into the categories above
body:
  - type: markdown
    attributes:
      value: |
        **Package removal:** We do not accept removal requests simply because a package or version was unpublished, deleted upstream, or is no longer needed. jsDelivr uses permanent storage to keep existing URLs working. Purging does not delete stored files.

        Report serious security or legal concerns privately to [legal@jsdelivr.com](mailto:legal@jsdelivr.com), with affected URLs and supporting evidence. Please do not open public issues for these reports.

        **Is your issue related to a specific project?**
        Please include all relevant links to cdn.jsdelivr.net, npm, GitHub, and your relation to the project.

  - type: textarea
    attributes:
      label: Description
      description: Describe your problem.
    validations:
      required: true
